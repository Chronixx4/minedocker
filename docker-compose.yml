# ZimaOS-/Compose-Deployment — Best Practices (v2)
#
# Start-Verhalten:
# - `docker compose up -d` startet Dashboard + Backup-Daemon. Es gibt KEINEN
#   festen Hauptserver: Alle Minecraft-Server sind Instanzen, die über das
#   Dashboard erstellt/gestartet werden (eigene itzg-Container,
#   /data/instances/{id}, Ports 25570+; Memory-Limit + Log-Rotation setzt das
#   Dashboard je Instanz automatisch). Instanzen mit Zeitplan (Auto-Start,
#   täglicher Neustart, geplante Backups) verwaltet der Dashboard-Scheduler.
# - Achtung: `docker compose down` entfernt das Compose-Netzwerk; laufende
#   Instanz-Container verlieren dadurch ihren Anschluss und werden beim nächsten
#   "Starten" im Dashboard automatisch neu erstellt.
#
# Best Practices in dieser Datei:
# - Neustart-Policy für alle Services (restart: unless-stopped)
# - Ressourcen-Limits (mem_limit/cpus) — Dashboard und Backup sind überschaubar
#   begrenzt, damit sie Instanzen nie verhungern lassen (siehe SERVER-SETUP.md §1)
# - Log-Rotation (json-file, max-size/max-file) gegen unbegrenzte Logfiles
# - Backup-Daemon: alle 6 h automatisch, 14 Tage Retention,
#   Volume nur lesend gemountet (:ro) (siehe SERVER-SETUP.md §5)
# - Security: nur der Spielport + 8080 werden gemappt; Dashboard niemals direkt
#   ins Internet (VPN/Reverse-Proxy), DASHBOARD_API_KEY setzen!
#
# Anpassbar über .env (Vorlage: .env.example):
# - DOCKER_GID            Host-GID von /var/run/docker.sock (Socket-Gruppe)
# - DASHBOARD_HTTP_PORT   Host-Port des Dashboards (Default 8080)
# - MCDATA_DIR            Datenablage: leer/„mcdata" = Named Volume; sonst
#                         Bind-Mount (ZimaOS: /DATA/AppData/mc-dashboard/data)
# - BACKUPS_DIR           Backup-Ablage (Default ./backups; ZimaOS: unter /DATA)
# - DASHBOARD_API_KEY, CF_API_KEY, CORS_ORIGINS, TZ, ALERT_*, INSTANCES_*
#   werden als ${VAR:-Default} aus .env durchgereicht (siehe dashboard:
#   environment) — so müssen Geheimnisse/spezielle Werte nicht in die
#   docker-compose.yml, sondern landen nur in der (gitignored) .env.
#
# ZimaOS-Hinweise:
# - Deployment bevorzugt per SSH: Projekt nach /DATA/AppData/mc-dashboard
#   kopieren, .env anlegen (Vorlage .env.example) und
#   `docker compose up -d --build` starten. Der App-Import in der ZimaOS-UI
#   baut KEINE Images (`build:` wird dort nicht ausgeführt).
# - Daten/Backups auf /DATA legen (Systemplatte von ZimaOS ist klein):
#   MCDATA_DIR=/DATA/AppData/mc-dashboard/data, BACKUPS_DIR=.../backups.
#   MCDATA_DIR muss ein dediziertes, exklusives Unterverzeichnis sein (nie
#   /DATA selbst) — der init-Service setzt beim Start automatisch die
#   Ownership (1000:1000) und bricht bei fremden Inhalten sicher ab.
# - DOCKER_GID ermitteln: `stat -c '%g' /var/run/docker.sock` (typisch 999;
#   Docker Desktop/WSL2: 0). Ohne passende GID meldet das Dashboard
#   „Permission denied" beim Socket-Zugriff.
# - Dashboard läuft als UID/GID 1000 (identisch mit itzg/minecraft-server),
#   damit die Zugriffsrechte auf das gemeinsame /data passen.
# - Scheduler-Zeiten laufen in Container-Lokalzeit → TZ setzen (z. B.
#   Europe/Berlin), sonst gilt UTC.
# - Port 8080 belegt? DASHBOARD_HTTP_PORT auf einen freien Port setzen.

services:
  init:
    # Ownership-Fix vor dem Dashboard-Start: Bind-Mounts und Bestands-Volumes
    # werden auf dem Host ggf. als root angelegt. Der Service setzt alles
    # unter /data auf UID/GID 1000 (Dashboard-User) und beendet sich.
    # Sicherungsleisten: idempotent (UID schon 1000 → sofortiges Exit 0) und
    # mit Fremdordner-Guard — enthält /data Daten ohne instances/ (z. B. weil
    # MCDATA_DIR versehentlich auf /DATA selbst oder ein fremdes Verzeichnis
    # zeigt), wird NICHT chown't, sondern mit FATAL abgebrochen.
    # restart: on-failure retryt bis zum Erfolg; Notfall-Start ohne init:
    #   docker compose up -d --no-deps dashboard   (Diagnose: compose logs init)
    image: alpine:3.20
    user: "0:0"
    restart: on-failure
    # Hardening: der Ownership-Fix braucht kein Netzwerk
    network_mode: none
    volumes:
      - ${MCDATA_DIR:-mcdata}:/data
    command: |
      uid=$$(stat -c %u /data) || true
      [ "$$uid" = "1000" ] && exit 0
      if [ -n "$$(ls -A /data 2>/dev/null)" ] && [ ! -d /data/instances ]; then
        echo "FATAL: /data enthaelt Daten ohne instances/ - MCDATA_DIR zeigt vermutlich auf ein fremdes Verzeichnis (z. B. /DATA selbst). Kein chown, Abbruch." >&2
        exit 1
      fi
      chown -R 1000:1000 /data
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  dashboard:
    build: .
    container_name: mc-dashboard
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      # Best Practices: Werte kommen als ${VAR:-Default} aus der .env
      # (gitignored) — Defaults identisch zu vorher (leer = Funktion aus).
      # Überschreiben in .env: DASHBOARD_API_KEY=<openssl rand -hex 32>
      DASHBOARD_API_KEY: "${DASHBOARD_API_KEY:-}"  # schützt alle API-Routen außer /api/health
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"          # lokal okay; bei Reverse-Proxy auf echte Origin setzen
      CF_API_KEY: "${CF_API_KEY:-}"               # CurseForge-API-Key (kostenlos: console.curseforge.com)
      TZ: "${TZ:-UTC}"                            # Scheduler-/Backup-Zeiten; z. B. Europe/Berlin
      # --- Multi-Server ---
      INSTANCES_DIR: "/data/instances"
      INSTANCES_PORT_BASE: "${INSTANCES_PORT_BASE:-25570}"
      INSTANCES_MEMORY: "${INSTANCES_MEMORY:-2G}" # Default-Heap pro Instanz (siehe SERVER-SETUP.md §1)
      INSTANCES_HOST_DIR: "${INSTANCES_HOST_DIR:-}" # leer = automatische Erkennung (empfohlen)
      # --- Crash-Watchdog/Alerts (optional, siehe SERVER-SETUP.md §8) ---
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}" # Discord-kompatibler Webhook; leer = aus
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}" # alternativ Telegram (Token + Chat-ID)
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      ALERT_EVENTS: "${ALERT_EVENTS:-crash,start,stop}" # oder z. B. "crash", +update für Update-Alerts
      # --- Scheduler (Zeitplan je Instanz, siehe Dashboard → Zeitplan-Box) ---
      # Geplante Neustarts laufen in Container-Lokalzeit → TZ oben setzen.
    ports:
      - "${DASHBOARD_HTTP_PORT:-8080}:8080"  # LAN/VPN only — nie direkt ins Internet!
    volumes:
      - ${MCDATA_DIR:-mcdata}:/data
      - /var/run/docker.sock:/var/run/docker.sock   # Instanz-Verwaltung + Ressourcen-Statistik
    # Gehärtet: UID/GID 1000 (Dockerfile-User, identisch mit itzg/minecraft-
    # server) statt root. Docker-Socket-Zugriff läuft über die Socket-Gruppe:
    # DOCKER_GID auf die Host-GID von /var/run/docker.sock setzen, ermitteln mit
    #   docker run --rm alpine:3.20 stat -c '%g' /var/run/docker.sock
    # oder auf dem Host: stat -c '%g' /var/run/docker.sock
    # Migration von Bestands-Volumes (früher root): übernimmt der init-Service
    # automatisch (Named Volume oder Bind) — manuell als Fallback:
    #   docker compose run --user 0 --rm dashboard chown -R 1000:1000 /data
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-999}"
    # Ressourcen-Deckel: Dashboard + Docker-SDK sind leichtgewichtig (§1)
    mem_limit: 1g
    cpus: 1.0
    # Log-Rotation gegen unbegrenzte Container-Logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    # Wartungsfreier Backup-Daemon: tar't das gesamte mcdata-Volume (alle
    # Instanzen + Mods) im 6-h-Takt, behält 14 Tage, legt latest.tgz-Symlink.
    # Bewusst ohne itzg/mc-backup: jenes blockiert ohne erreichbares RCON —
    # Instanz-Container laufen hier mit ENABLE_RCON=FALSE. Hinweis §5:
    # Für 100 % konsistente Weltschnappschüsse Instanz vorher stoppen.
    image: alpine:3.20
    container_name: mc-backup
    restart: unless-stopped
    volumes:
      - ${MCDATA_DIR:-mcdata}:/data:ro                 # ALLE Instanzen + Mods: nur lesend
      - ${BACKUPS_DIR:-./backups}:/backups             # Backup-Ablageort auf dem Host
    command: >
      sh -c "while true; do
               ts=$$(date +%F-%H%M);
               tar --exclude='./backups' -czf /backups/mcdata-$$ts.tgz -C /data . &&
               ln -sf mcdata-$$ts.tgz /backups/latest.tgz &&
               echo backup mcdata-$$ts.tgz ok ||
               echo backup mcdata-$$ts.tgz FEHLGESCHLAGEN >&2;
               find /backups -name 'mcdata-*.tgz' -mtime +14 -delete;
               sleep 6h;
             done"
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  mcdata:
