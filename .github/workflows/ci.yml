# CI: Lint (ruff), Typen (mypy) und Testsuite (pytest) bei jedem Push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Lockfiles aktuell?
        run: |
          pip install uv
          uv pip compile requirements.in -o /tmp/req.txt --python-version 3.12 --generate-hashes -q
          uv pip compile requirements-dev.in -o /tmp/req-dev.txt --python-version 3.12 --generate-hashes -q
          # Nur Pin-Zeilen vergleichen (Kopfkommentar enthält den Dateipfad)
          diff <(grep -E '^[a-zA-Z0-9_.-]+==' requirements.txt) <(grep -E '^[a-zA-Z0-9_.-]+==' /tmp/req.txt)
          diff <(grep -E '^[a-zA-Z0-9_.-]+==' requirements-dev.txt) <(grep -E '^[a-zA-Z0-9_.-]+==' /tmp/req-dev.txt)

      - name: pip-audit (bekannte Schwachstellen)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --no-deps --disable-pip

      - name: ruff (Lint)
        run: python -m ruff check app tests

      - name: mypy (Typen, app/)
        run: python -m mypy

      - name: pytest (Testsuite)
        run: python -m pytest tests/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t mc-dashboard:ci .
      - name: Trivy (HIGH/CRITICAL im Image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mc-dashboard:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
