# Docker-Image bauen und nach GHCR pushen — Grundlage für die
# ZimaOS-UI-Installation (App-Import führt KEIN `build:` aus, nur Pull).
# Release-Tags (v* → Semver) baut docker-build.yml; hier nur `latest` von main.
name: docker-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Schnell aufeinanderfolgende Pushes: letzter Stand gewinnt, keine
# parallelen Builds auf denselben Cache/Tag
concurrency:
  group: docker-publish-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR verlangt Kleinschreibung; github.repository trägt hier die
      # Großschreibung des Owners (Chronixx4) — daher explizit lowercasing.
      - name: Image-Name (lowercase)
        id: repo
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR-Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Kurz-SHA (für APP_VERSION)
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Bauen und pushen (latest + Commit-SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo.outputs.name }}:latest
            ${{ steps.repo.outputs.name }}:${{ github.sha }}
          build-args: |
            APP_VERSION=main-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
